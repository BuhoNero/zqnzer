<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#323232">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Zqnzer</title>
  <link rel="stylesheet" href="src/style.css?v=202611201418">
</head>
<body>
  <main id="app">
    <div id="sample">
      <button id="prev" aria-label="Previous sample">‹</button>
      <button id="sname"></button>
      <button id="next" aria-label="Next sample">›</button>
      <button id="menu" aria-label="Options">⋯</button>
    </div>
    <section id="wave"><canvas></canvas></section>
    <div id="grid">
      <section id="tracks"></section>
      <section id="pads"></section>
    </div>
    <footer>
      <button id="play" aria-label="Play">▶</button>
      <button id="patbtn" aria-label="Pattern mode">A1</button>
      <div id="tempo">
        <button id="slower">−</button>
        <span id="bpm"></span>
        <button id="faster">+</button>
      </div>
      <button id="clear">clear</button>
    </footer>
    <div id="build"></div>
  </main>
  <div id="hud"></div>
  <div id="sheet" hidden><ul></ul></div>
  <div id="rec" hidden>
    <div class="box">
      <div id="rectitle">Record</div>
      <div class="meter"><i id="reclevel"></i></div>
      <button id="recbtn" aria-label="Record">●</button>
      <div class="meter time"><i id="recprog"></i></div>
      <div id="rechint"></div>
      <button id="reccancel">cancel</button>
    </div>
  </div>
  <div id="unlock">tap to start</div>
  <script type="module" src="src/main.js?v=202611201418"></script>
</body>
</html>
